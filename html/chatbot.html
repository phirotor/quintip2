<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Chatbot - Proyecto Q´inti</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../css/style.css">

</head>


<body class="m-0">



  <div id="header"></div>


  <main>

    <div class="background position-relative chatbot-page">


      <div class="chatbot-container">



        <div class="chatbot-header">

          <div class="chatbot-icon">
              <img src="../img/quinti-min.png" alt="Q´inti">

          </div>

          <div>

            <h1 class="chatbot-title">
              Asistente Q´inti
            </h1>

            <p class="chatbot-subtitle">
              Tu asistente sobre propiedad intelectual
            </p>

          </div>

        </div>



        <div
          id="chatMessages"
          class="chatbot-messages">

          <div class="chat-message bot">

            <strong>Q´inti:</strong><br>

            ¡Hola! Soy Q´inti, tu asistente de
            propiedad intelectual.

            <br><br>

            Puedo ayudarte a conocer más sobre:

            <br><br>

            • Propiedad industrial<br>
            • Derechos de autor<br>
            • Derecho sui generis

          </div>


          <div class="chat-message bot">

            ¿Qué te gustaría saber?

          </div>

        </div>


        <!-- PREGUNTAS RÁPIDAS -->

        <div class="chatbot-suggestions">

          <button
            class="suggestion"
            onclick="preguntaRapida('¿Qué es la propiedad intelectual?')">

            ¿Qué es propiedad intelectual?

          </button>


          <button
            class="suggestion"
            onclick="preguntaRapida('¿Qué es una patente?')">

            ¿Qué es una patente?

          </button>


          <button
            class="suggestion"
            onclick="preguntaRapida('¿Qué son los derechos de autor?')">

            Derechos de autor

          </button>


          <button
            class="suggestion"
            onclick="preguntaRapida('¿Qué es una marca?')">

            ¿Qué es una marca?

          </button>

        </div>


        <!-- INPUT -->

        <div class="chatbot-input-area">

          <form
            id="chatForm"
            class="chatbot-form">

            <input
              id="chatInput"
              type="text"
              class="chatbot-input"
              placeholder="Escribe tu pregunta..."
              autocomplete="off">

            <button
              type="submit"
              class="chatbot-send"
              aria-label="Enviar">

              <i class="bi bi-send-fill"></i>

            </button>

          </form>

        </div>


      </div>

    </div>

  </main>



  <script src="../js/quinti.js"></script>

  <script src="../js/main.js"></script>



  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../js/chatbot.js"></script>


</body>

</html>
