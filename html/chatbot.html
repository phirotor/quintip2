<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Chatbot - Proyecto Q´inti</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- CSS del proyecto -->
  <link rel="stylesheet" href="../css/style.css">

</head>


<body class="m-0">


  <!-- CABECERA DEL PROYECTO -->

  <div id="header"></div>


  <!-- =========================================
       CHATBOT
  ========================================= -->

  <main>

    <div class="background position-relative chatbot-page">


      <div class="chatbot-container">


        <!-- CABECERA -->

        <div class="chatbot-header">

          <div class="chatbot-icon">
            🤖
          </div>

          <div>

            <h1 class="chatbot-title">
              Asistente Q´inti
            </h1>

            <p class="chatbot-subtitle">
              Tu asistente sobre propiedad intelectual
            </p>

          </div>

        </div>


        <!-- MENSAJES -->

        <div
          id="chatMessages"
          class="chatbot-messages">

          <div class="chat-message bot">

            <strong>Q´inti:</strong><br>

            ¡Hola! 👋 Soy Q´inti, tu asistente de
            propiedad intelectual.

            <br><br>

            Puedo ayudarte a conocer más sobre:

            <br><br>

            • Propiedad industrial<br>
            • Derechos de autor<br>
            • Derecho sui generis

          </div>


          <div class="chat-message bot">

            ¿Qué te gustaría saber?

          </div>

        </div>


        <!-- PREGUNTAS RÁPIDAS -->

        <div class="chatbot-suggestions">

          <button
            class="suggestion"
            onclick="preguntaRapida('¿Qué es la propiedad intelectual?')">

            ¿Qué es propiedad intelectual?

          </button>


          <button
            class="suggestion"
            onclick="preguntaRapida('¿Qué es una patente?')">

            ¿Qué es una patente?

          </button>


          <button
            class="suggestion"
            onclick="preguntaRapida('¿Qué son los derechos de autor?')">

            Derechos de autor

          </button>


          <button
            class="suggestion"
            onclick="preguntaRapida('¿Qué es una marca?')">

            ¿Qué es una marca?

          </button>

        </div>


        <!-- INPUT -->

        <div class="chatbot-input-area">

          <form
            id="chatForm"
            class="chatbot-form">

            <input
              id="chatInput"
              type="text"
              class="chatbot-input"
              placeholder="Escribe tu pregunta..."
              autocomplete="off">

            <button
              type="submit"
              class="chatbot-send"
              aria-label="Enviar">

              <i class="bi bi-send-fill"></i>

            </button>

          </form>

        </div>


      </div>

    </div>

  </main>


  <!-- SCRIPTS DEL PROYECTO -->

  <script src="../js/quinti.js"></script>

  <script src="../js/main.js"></script>


  <!-- Bootstrap JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>


  <!-- =========================================
       CHATBOT JS
  ========================================= -->

  <script>

    const chatForm =
      document.getElementById("chatForm");

    const chatInput =
      document.getElementById("chatInput");

    const chatMessages =
      document.getElementById("chatMessages");


    function agregarMensaje(texto, tipo) {

      const mensaje =
        document.createElement("div");

      mensaje.classList.add(
        "chat-message",
        tipo
      );

      if (tipo === "bot") {

        mensaje.innerHTML =
          "<strong>Q´inti:</strong><br>" +
          texto;

      } else {

        mensaje.textContent = texto;

      }

      chatMessages.appendChild(mensaje);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;
    }


    function obtenerRespuesta(pregunta) {

      const texto =
        pregunta.toLowerCase();


      if (
        texto.includes("propiedad intelectual") ||
        texto.includes("que es propiedad")
      ) {

        return `
          La <strong>propiedad intelectual</strong>
          protege las creaciones de la mente, como
          invenciones, obras artísticas, diseños,
          marcas y otros elementos creados por las
          personas.
        `;

      }


      if (
        texto.includes("patente") ||
        texto.includes("invencion")
      ) {

        return `
          Una <strong>patente</strong> es un derecho
          exclusivo que se concede sobre una invención.
          Permite a su titular protegerla frente a
          determinados usos no autorizados durante el
          periodo establecido por la legislación.
        `;

      }


      if (
        texto.includes("derecho de autor") ||
        texto.includes("derechos de autor")
      ) {

        return `
          Los <strong>derechos de autor</strong>
          protegen las obras originales creadas por
          una persona, como libros, música,
          fotografías, películas y programas
          informáticos.
        `;

      }


      if (
        texto.includes("marca") ||
        texto.includes("marcas")
      ) {

        return `
          Una <strong>marca</strong> es un signo que
          permite distinguir los productos o servicios
          de una empresa de los de otras empresas.
        `;

      }


      if (
        texto.includes("sui generis") ||
        texto.includes("sui")
      ) {

        return `
          El <strong>derecho sui generis</strong>
          corresponde a determinadas creaciones o
          contenidos que reciben una protección jurídica
          particular.
        `;

      }


      if (
        texto.includes("hola") ||
        texto.includes("buenas")
      ) {

        return `
          ¡Hola! 👋

          <br><br>

          ¿Qué quieres aprender sobre propiedad
          intelectual?
        `;

      }


      return `
        Todavía estoy aprendiendo sobre ese tema. 🤔

        <br><br>

        Puedes preguntarme sobre:

        <br><br>

        • Propiedad intelectual<br>
        • Patentes<br>
        • Marcas<br>
        • Derechos de autor<br>
        • Derecho sui generis
      `;

    }


    function enviarPregunta(pregunta) {

      pregunta =
        pregunta.trim();

      if (!pregunta) return;


      agregarMensaje(
        pregunta,
        "user"
      );


      chatInput.value = "";


      setTimeout(() => {

        const respuesta =
          obtenerRespuesta(pregunta);

        agregarMensaje(
          respuesta,
          "bot"
        );

      }, 500);

    }


    chatForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        enviarPregunta(
          chatInput.value
        );

      }
    );


    function preguntaRapida(pregunta) {

      enviarPregunta(pregunta);

    }

  </script>


</body>

</html>
