<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Proyecto Q´inti</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
    }



    #start-screen {

      position: fixed;

      inset: 0;

      z-index: 10;

      display: flex;

      justify-content: center;

      align-items: center;

      cursor: pointer;
    }


    .start-content {

      text-align: center;

      color: #028c8d;

      padding: 30px;
    }


.start-title {
  font-size: 3rem;
  margin-bottom: 20px;
  font-weight: bold;

  color: #f4a261;

  text-shadow:
    0 2px 5px rgba(0, 0, 0, 0.15);
}

.start-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  padding: 14px 28px;

  border-radius: 50px;

  background: #aee6ff;
  color: #028c8d;

  font-size: 1.2rem;
  font-weight: 600;

  box-shadow:
    0 5px 20px rgba(0, 0, 0, 0.2);

  transition: 0.2s;
}

.start-subtitle {
  margin-top: 18px;

  font-size: 1rem;
  line-height: 1.5;

  font-weight: 500;

  color: #028c8d;

  text-align: center;

  text-shadow:
    0 2px 5px rgba(0, 0, 0, 0.1);
}


    .start-button:hover {

      transform: scale(1.05);

      background: #8bdcff;
    }



    .video-container {

      width: 100vw;

      height: 100vh;

      background: #000;
    }


    video {

    width: 100vw;
    height: 100vh;

      object-fit: cover;

      display: none;
    }
.quinti-logo {
  width: 110px;
  max-width: 30vw;
  height: auto;
  display: block;
  margin: 0 auto 8px;
}
  </style>

</head>


<body>




  <div
    id="start-screen"
    class="background">

 <div class="start-content">

  <img
    src="../img/quinti-min.png"
    alt="Q´inti"
    class="quinti-logo">
    
  <div class="start-title">
    Q´inti
  </div>



  <div class="start-subtitle">
    Ideas que vuelan<br>
    Conocimiento que protege
  </div>
  <br><br>
  <div class="start-button">
    <span>▶</span>
    <span>Comenzar</span>
  </div>
</div>
  </div>



  <div class="video-container">

    <!-- Horizontal -->

    <video
      id="video-horizontal"
      playsinline
      preload="auto">

      <source
        src="../videos/horizon.mp4"
        type="video/mp4">

    </video>


    <!-- Vertical -->

    <video
      id="video-vertical"
      playsinline
      preload="auto">

      <source
        src="../videos/vert.mp4"
        type="video/mp4">

    </video>

  </div>



  <script>

    const startScreen =
      document.getElementById("start-screen");

    const videoHorizontal =
      document.getElementById("video-horizontal");

    const videoVertical =
      document.getElementById("video-vertical");


    let videoSeleccionado = null;




    function seleccionarVideo() {

      if (window.innerWidth > window.innerHeight) {

        // Horizontal

        videoHorizontal.style.display = "block";

        videoVertical.style.display = "none";

        videoVertical.pause();

        videoSeleccionado = videoHorizontal;

      } else {

        // Vertical

        videoHorizontal.style.display = "none";

        videoVertical.style.display = "block";

        videoHorizontal.pause();

        videoSeleccionado = videoVertical;

      }

    }


    startScreen.addEventListener("click", function() {

      seleccionarVideo();



      startScreen.style.display = "none";



      videoSeleccionado
        .play()
        .catch(error => {

          console.log(
            "No se pudo reproducir el video:",
            error
          );

        });

    });


    window.addEventListener(
      "resize",
      seleccionarVideo
    );


    videoHorizontal.addEventListener(
      "ended",
      irAlIndex
    );


    videoVertical.addEventListener(
      "ended",
      irAlIndex
    );


    function irAlIndex() {

      window.location.href = "index.html";

    }

  </script>


</body>

</html>
