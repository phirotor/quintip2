<!doctype html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Proyecto Q'inti</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .video-container {
      width: 100vw;
      height: 100vh;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
  </style>

</head>

<body>

  <div class="video-container">

```
<!-- VIDEO HORIZONTAL -->
<video
  id="video-horizontal"
  autoplay
  muted
  playsinline
  preload="auto">
  <source src="../videos/horizon.mp4" type="video/mp4">
</video>

<!-- VIDEO VERTICAL -->
<video
  id="video-vertical"
  autoplay
  muted
  playsinline
  preload="auto">
  <source src="../videos/vert.mp4" type="video/mp4">
</video>
```

  </div>

  <script>

    const videoHorizontal = document.getElementById("video-horizontal");
    const videoVertical = document.getElementById("video-vertical");

    let videoSeleccionado = null;

    function seleccionarVideo() {

      // Pantalla horizontal
      if (window.innerWidth > window.innerHeight) {

        videoHorizontal.style.display = "block";
        videoVertical.style.display = "none";

        videoVertical.pause();

        videoSeleccionado = videoHorizontal;

      }

      // Pantalla vertical
      else {

        videoHorizontal.style.display = "none";
        videoVertical.style.display = "block";

        videoHorizontal.pause();

        videoSeleccionado = videoVertical;

      }

      videoSeleccionado.play().catch(error => {
        console.log("El navegador bloqueó el autoplay:", error);
      });
    }

    seleccionarVideo();


    // Si cambia la orientación de la pantalla
    window.addEventListener("resize", seleccionarVideo);


    // Cuando termine el video → index.html
    videoHorizontal.addEventListener("ended", irAlIndex);
    videoVertical.addEventListener("ended", irAlIndex);


    function irAlIndex() {
      window.location.href = "index.html";
    }

  </script>

</body>
</html>
